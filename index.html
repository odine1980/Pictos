<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pictos Tracker - Clair Obscur: Expedition 33</title>
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --accent: #e94560;
            --accent-hover: #ff6b6b;
            --text-primary: #eee;
            --text-secondary: #aaa;
            --text-muted: #666;
            --border: #2a2a4a;
            --success: #4ecca3;
            --warning: #f4d03f;
            --danger: #e74c3c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-card));
            border-radius: 16px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .stat {
            text-align: center;
            padding: 12px 24px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            min-width: 120px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-primary);
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--success));
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 24px;
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
            color: var(--text-primary);
        }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: white;
        }

        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .filter-btn:hover:not(.active) {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .sections {
            display: grid;
            gap: 24px;
        }

        .section {
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .section-header {
            padding: 16px 24px;
            background: linear-gradient(90deg, var(--bg-card), var(--bg-secondary));
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .section-header h2 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header .count {
            background: var(--accent);
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .section-header .toggle-icon {
            font-size: 1.2rem;
            transition: transform 0.2s;
        }

        .section.collapsed .toggle-icon {
            transform: rotate(-90deg);
        }

        .section.collapsed .pictos-grid {
            display: none;
        }

        .pictos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1px;
            background: var(--border);
        }

        .picto-item {
            background: var(--bg-secondary);
            padding: 14px 18px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }

        .picto-item:hover {
            background: var(--bg-card);
        }

        .picto-item.collected {
            background: rgba(78, 204, 163, 0.08);
        }

        .picto-item.collected .picto-name {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .picto-item.missable {
            border-left: 3px solid var(--warning);
        }

        .picto-item.dlc {
            border-left: 3px solid var(--accent);
        }

        .picto-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
            margin-top: 2px;
        }

        .picto-item.collected .picto-checkbox {
            background: var(--success);
            border-color: var(--success);
        }

        .picto-checkbox svg {
            width: 14px;
            height: 14px;
            stroke: white;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .picto-item.collected .picto-checkbox svg {
            opacity: 1;
        }

        .picto-info {
            flex: 1;
            min-width: 0;
        }

        .picto-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .picto-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .picto-effect {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-style: italic;
            margin-top: 3px;
            line-height: 1.35;
        }

        .picto-item.collected .picto-effect {
            color: var(--text-muted);
        }

        .picto-badges {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-missable {
            background: rgba(244, 208, 63, 0.15);
            color: var(--warning);
        }

        .badge-dlc {
            background: rgba(233, 69, 96, 0.15);
            color: var(--accent);
        }

        .badge-cost {
            background: rgba(78, 204, 163, 0.12);
            color: var(--success);
        }

        .hidden {
            display: none !important;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.5rem;
            }

            .pictos-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                max-width: none;
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
    </style>
</head>

                    <div class="stat-label">Total</div>

                <div class="stat">

                    <div class="stat-label">Remaining</div>

                <div class="stat" style="min-width: 200px;">
                    <div class="stat-value" id="percent-count">0%</div>
                    <div class="stat-label">Complete</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                    </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search Pictos by name...">

            <div class="filters">

                <button class="filter-btn" data-filter="missable">Missable</button>
                <button class="filter-btn" data-filter="dlc">DLC</button>

            <div style="display: flex; gap: 8px;">

        <footer>

            <p style="margin-top: 8px;">Progress is saved automatically to your browser's local storage</p>
        </footer>
    </div>

        // State
        let collected = new Set();
        let currentFilter = 'all';
        let searchQuery = '';

        // Load from localStorage
        function loadState() {
            try {
                const saved = localStorage.getItem('pictos-collected');
                if (saved) {
                    collected = new Set(JSON.parse(saved));
                }
            } catch (e) {
                console.error('Failed to load state:', e);
            }
        }

        // Save to localStorage
        function saveState() {
            try {
                localStorage.setItem('pictos-collected', JSON.stringify([...collected]));
            } catch (e) {
                console.error('Failed to save state:', e);
            }
        }

        // Get first letter for grouping
        function getFirstLetter(name) {
            return name.charAt(0).toUpperCase();
        }

        // Group pictos by first letter
        function groupByLetter(pictos) {
            const groups = {};
            pictos.forEach(p => {
                const letter = getFirstLetter(p.name);
                if (!groups[letter]) groups[letter] = [];
                groups[letter].push(p);
            });
            return groups;
        }

        // Render a picto item
        function renderPictoItem(picto, type) {
            const isCollected = collected.has(picto.name);
            const classes = ['picto-item'];
            if (isCollected) classes.push('collected');
            if (type === 'missable') classes.push('missable');
            if (type === 'dlc') classes.push('dlc');

            const badges = [];
            if (type === 'missable') badges.push('<span class="badge badge-missable">Missable</span>');
            if (type === 'dlc') badges.push('<span class="badge badge-dlc">DLC</span>');
            if (picto.cost) badges.push(`<span class="badge badge-cost" title="Lumina Points cost">${picto.cost} LP</span>`);

            return `
                <div class="${classes.join(' ')}" data-name="${picto.name.toLowerCase()}" data-type="${type}" onclick="togglePicto('${picto.name.replace(/'/g, "\\'")}')">
                    <div class="picto-checkbox">
                        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <div class="picto-info">
                        <div class="picto-name">${picto.name}</div>
                        <div class="picto-meta">${picto.location}</div>
                        ${picto.effect ? `<div class="picto-effect">${picto.effect}</div>` : ''}
                    </div>
                    <div class="picto-badges">${badges.join('')}</div>
                </div>
            `;
        }

        // Toggle picto collected state
        function togglePicto(name) {
            if (collected.has(name)) {
                collected.delete(name);
            } else {
                collected.add(name);
            }
            saveState();
            render();
        }

        // Update stats
        function updateStats() {
            const total = PICTOS_DATA.missable.length + PICTOS_DATA.dlc.length + PICTOS_DATA.base.length;
            const collectedCount = collected.size;
            const remaining = total - collectedCount;
            const percent = total > 0 ? Math.round((collectedCount / total) * 100) : 0;

            document.getElementById('collected-count').textContent = collectedCount;
            document.getElementById('total-count').textContent = total;
            document.getElementById('remaining-count').textContent = remaining;
            document.getElementById('percent-count').textContent = percent + '%';
            document.getElementById('progress-fill').style.width = percent + '%';
        }

        // Filter pictos
        function shouldShow(picto, type) {
            const isCollected = collected.has(picto.name);

            // Search filter
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                if (!picto.name.toLowerCase().includes(query) &&
                    !picto.location.toLowerCase().includes(query) &&
                    !(picto.effect && picto.effect.toLowerCase().includes(query))) {
                    return false;
                }
            }

            // Type filter
            switch (currentFilter) {
                case 'missing':
                    return !isCollected;
                case 'collected':
                    return isCollected;
                case 'missable':
                    return type === 'missable';
                case 'dlc':
                    return type === 'dlc';
                default:
                    return true;
            }
        }

        // Render sections
        function render() {
            const container = document.getElementById('sections-container');
            container.innerHTML = '';

            // Render base game as one big alphabetical list with sticky letter headers
            const baseVisible = PICTOS_DATA.base.filter(p => shouldShow(p, 'base'));
            if (baseVisible.length > 0 || currentFilter === 'all') {
                const baseCollected = baseVisible.filter(p => collected.has(p.name)).length;
                const groups = groupByLetter(baseVisible);
                const sortedLetters = Object.keys(groups).sort();

                let baseGridHtml = '';
                sortedLetters.forEach(letter => {
                    const pictos = groups[letter];
                    baseGridHtml += pictos.map(p => renderPictoItem(p, 'base')).join('');
                });

                container.innerHTML += `
                    <div class="section" id="section-base">
                        <div class="section-header" onclick="toggleSection('section-base')">
                            <h2>🎮 Base Game Pictos <span class="count">${baseCollected}/${baseVisible.length}</span></h2>
                            <span class="toggle-icon">▼</span>
                        </div>
                        <div class="pictos-grid">
                            ${baseGridHtml}
                        </div>
                    </div>
                `;
            }

            // Render DLC section
            const dlcVisible = PICTOS_DATA.dlc.filter(p => shouldShow(p, 'dlc'));
            if (dlcVisible.length > 0 || currentFilter === 'dlc' || currentFilter === 'all') {
                const dlcCollected = PICTOS_DATA.dlc.filter(p => collected.has(p.name)).length;
                container.innerHTML += `
                    <div class="section" id="section-dlc">
                        <div class="section-header" onclick="toggleSection('section-dlc')">
                            <h2>📦 DLC Pictos (Thank You Update) <span class="count">${dlcCollected}/${PICTOS_DATA.dlc.length}</span></h2>
                            <span class="toggle-icon">▼</span>
                        </div>
                        <div class="pictos-grid">
                            ${dlcVisible.map(p => renderPictoItem(p, 'dlc')).join('')}
                        </div>
                    </div>
                `;
            }

            // Render missable section
            const missableVisible = PICTOS_DATA.missable.filter(p => shouldShow(p, 'missable'));
            if (missableVisible.length > 0 || currentFilter === 'missable' || currentFilter === 'all') {
                const missableCollected = PICTOS_DATA.missable.filter(p => collected.has(p.name)).length;
                container.innerHTML += `
                    <div class="section" id="section-missable">
                        <div class="section-header" onclick="toggleSection('section-missable')">
                            <h2>⚠️ Missable Pictos <span class="count">${missableCollected}/${PICTOS_DATA.missable.length}</span></h2>
                            <span class="toggle-icon">▼</span>
                        </div>
                        <div class="pictos-grid">
                            ${missableVisible.map(p => renderPictoItem(p, 'missable')).join('')}
                        </div>
                    </div>
                `;
            }

            // Show empty state if nothing visible
            if (container.innerHTML === '') {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <p>No Pictos match your current filters.</p>
                    </div>
                `;
            }

            updateStats();
        }

        // Toggle section collapse
        function toggleSection(id) {
            const section = document.getElementById(id);
            section.classList.toggle('collapsed');
        }

        // Export data
        function exportData() {
            const data = {
                collected: [...collected],
                timestamp: new Date().toISOString(),
                version: 1
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'pictos-tracker-backup.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Import data
        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.collected && Array.isArray(data.collected)) {
                            collected = new Set(data.collected);
                            saveState();
                            render();
                            alert('Progress imported successfully!');
                        } else {
                            alert('Invalid backup file format.');
                        }
                    } catch (err) {
                        alert('Failed to parse backup file.');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // Reset all progress
        function resetProgress() {
            if (confirm('Are you sure you want to reset all progress? This cannot be undone.')) {
                collected.clear();
                saveState();
                render();
            }
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            loadState();

            // If user has collected at least one pictos, default to showing missing only
            if (collected.size > 0) {
                currentFilter = 'missing';
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                document.querySelector('.filter-btn[data-filter="missing"]').classList.add('active');
            }

            render();

            // Search
            document.getElementById('search-input').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                render();
            });

            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    render();
                });
            });

            // Action buttons
            document.getElementById('export-btn').addEventListener('click', exportData);
            document.getElementById('import-btn').addEventListener('click', importData);
            document.getElementById('reset-btn').addEventListener('click', resetProgress);
        });
    </script>
